<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="css/general_style.css" />
		<link rel="stylesheet" media="screen and (min-width: 801px)" href="css/sidenav.css" />
		<link rel="stylesheet" href="css/calendar_desktop.css" />
		<link rel="stylesheet" media="screen and (max-width: 800px)" href="css/topnav.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="icon" type="image/svg+xml" href="img/flag_logo_cartoon.svg">
		<title>Fits Like a Glove</title>
	</head>
	<body>
		<div class="wrapper">
			<div id="topnav-container"></div>
			<div class="sidenav" id="sidenav-container"></div>
			<div class="content fade-container" id="MainContent">
				<article>
					<p class="title">Events Calendar</p>
					<div class="Calendar_Container">
						<div class="Calendar">
							<div class="Calendar_Header">
								<button id="prevBtn"><span = "mobile-arrows">&#9668;</span><span = "desktop-arrows">&#11160;</span></button>
								<div class="monthYear" id="monthYear"></div>
								<button id="nextBtn"><span = "mobile-arrows">&#9658;</span><span = "desktop-arrows">&#11162;</span></button>
							</div>
							<div class="Calendar_Days">
								<div class="Calendar_Day">Su<span class="desktop-days">nday</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Mo<span class="desktop-days">nday</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Tu<span class="desktop-days">esday</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Wed<span class="desktop-days">nesday</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Thu<span class="desktop-days">rsday</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Fri<span class="desktop-days">day</span><span class="mobile-days">.</span></div>
								<div class="Calendar_Day">Sat<span class="desktop-days">urday</span><span class="mobile-days">.</span></div>
							</div>
							<div class="Calendar_Dates" id="Calendar_Dates"></div>
						</div>
					</div>
				</article>
				<div id="eventModal" class="modal">
					<div class="modal-content">
						<span class="close-button">&times;</span>
						<ul id="EventDetailsList"></ul>
					</div>
				</div>
			</div>
		</div>
		<script src="scripts/modal.js"></script>
		<script src="scripts/calendar.js"></script>
		<script src="scripts/sidebar_loader.js"></script>
		<script src="scripts/fade_nav.js"></script>
	</body>
</html>
